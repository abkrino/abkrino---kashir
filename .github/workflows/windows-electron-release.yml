name: Windows Electron Release Validation

concurrency:
  group: windows-electron-release
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - release/electron-voice-announcer
  pull_request:
    branches:
      - main
      - release/electron-voice-announcer
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Abkrino-Kashir-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
